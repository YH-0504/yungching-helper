<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英泓廣告小幫手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --primary-glow: rgba(245, 158, 11, 0.25);
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(15, 23, 42, 0.6);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --line-color: #06c755;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; }
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
    }

    .container { width: 100%; max-width: 1080px; display: flex; flex-direction: column; gap: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 42px; height: 42px; background: linear-gradient(135deg, #f59e0b, #ea580c);
      border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 20px; color: #fff; box-shadow: 0 4px 15px var(--primary-glow);
    }
    .brand-text h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .brand-text p { font-size: 13px; color: var(--text-muted); }
    .badge-status {
      display: flex; align-items: center; gap: 6px; font-size: 12px;
      background: rgba(16, 185, 129, 0.1); color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.2); padding: 6px 12px; border-radius: 20px;
    }
    .badge-status::before {
      content: ""; width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%;
    }

    .card {
      background: var(--card-bg); backdrop-filter: blur(16px);
      border: 1px solid var(--card-border); border-radius: var(--radius-lg);
      padding: 22px; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .action-bar { display: flex; gap: 10px; flex-wrap: wrap; }
    .input-wrapper { position: relative; flex: 1; min-width: 280px; }
    .input-wrapper svg {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
    }

    input[type="text"], textarea {
      width: 100%; background: var(--input-bg); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md); color: var(--text-main); font-size: 15px;
      padding: 13px 16px 13px 44px; outline: none; transition: 0.2s;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow);
      background: rgba(15, 23, 42, 0.85);
    }
    input::placeholder, textarea::placeholder { color: rgba(148, 163, 184, 0.6); }

    .clear-btn {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; color: var(--text-muted); cursor: pointer;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 20px; border-radius: var(--radius-md); font-size: 15px; font-weight: 700;
      border: none; cursor: pointer; transition: 0.2s; white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #0f172a; box-shadow: 0 4px 15px var(--primary-glow);
    }
    .btn-primary:hover { filter: brightness(1.08); }

    .btn-portal {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc; font-weight: 600;
    }
    .btn-portal:hover {
      background: rgba(255, 255, 255, 0.16); border-color: rgba(255, 255, 255, 0.3);
    }

    .step-helper {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; gap: 8px;
    }

    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

    .section-title {
      font-size: 14px; font-weight: 600; color: var(--text-muted);
      margin-bottom: 14px; display: flex; justify-content: space-between;
    }

    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field-full { grid-column: span 2; }
    .field-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
    .field-group input { padding: 9px 12px; font-size: 14px; }
    textarea.feature-editor { min-height: 180px; line-height: 1.6; resize: vertical; padding: 12px 14px; font-size: 13px; }

    .output-container { display: flex; flex-direction: column; gap: 12px; }
    .preview-box {
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md); padding: 18px; font-size: 14.5px; line-height: 1.75;
      white-space: pre-wrap; word-break: break-all; min-height: 480px; flex: 1;
    }

    .empty-state {
      height: 100%; min-height: 400px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: var(--text-muted); text-align: center; gap: 12px;
    }
    .empty-state svg { opacity: 0.3; }

    .btn-group { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-top: 4px; }
    .btn-copy { background: var(--accent-green); color: #fff; }
    .btn-copy:hover { background: var(--accent-green-hover); }
    .btn-line { background: var(--line-color); color: #fff; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: #fff;
      padding: 12px 20px; border-radius: var(--radius-md); border-left: 4px solid var(--accent-green);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); opacity: 0; transform: translateY(100px);
      transition: 0.3s; z-index: 999; font-size: 14px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="brand">
      <div class="brand-icon">英</div>
      <div class="brand-text">
        <h1>英泓廣告小幫手</h1>
        <p>貼上物件網址 ‧ 自動抓取精準排版</p>
      </div>
    </div>
    <div class="badge-status">高精準直通代理模式</div>
  </header>

  <section class="card">
    <div class="action-bar">
      <button class="btn btn-portal" onclick="openYungChing()">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
        開啟永慶網站
      </button>

      <div class="input-wrapper">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
        <input type="text" id="targetUrl" placeholder="貼上永慶物件網址（例：https://buy.yungching.com.tw/house/7306855）..." autocomplete="off">
        <button class="clear-btn" onclick="clearInput()">✕</button>
      </div>

      <button class="btn btn-primary" id="fetchBtn" onclick="fetchAndParse()">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        抓取整理資料
      </button>
    </div>

    <div class="step-helper">
      <div>只需貼上永慶網址，系統自動完成所有提取與排版</div>
      <div id="statusMessage">貼上網址後點擊「抓取整理資料」</div>
    </div>
  </section>

  <div class="main-grid">
    <div class="card">
      <div class="section-title">
        <span>規格細項微調</span>
        <span style="font-size: 11px; color: var(--text-muted);">修改後同步更新預覽</span>
      </div>

      <div class="field-grid">
        <div class="field-group"><label>開價</label><input type="text" id="f_price" placeholder="例：1,536萬" oninput="renderOutput()"></div>
        <div class="field-group"><label>地址 / 社區</label><input type="text" id="f_address" placeholder="例：台南市永康區永勝街" oninput="renderOutput()"></div>
        <div class="field-group"><label>總建坪數</label><input type="text" id="f_totalPing" placeholder="例：48.98坪" oninput="renderOutput()"></div>
        <div class="field-group"><label>主建物</label><input type="text" id="f_mainPing" placeholder="例：22.71坪" oninput="renderOutput()"></div>
        <div class="field-group"><label>附屬建物</label><input type="text" id="f_subPing" placeholder="例：2.98坪" oninput="renderOutput()"></div>
        <div class="field-group"><label>共同使用</label><input type="text" id="f_sharedPing" placeholder="例：23.29坪" oninput="renderOutput()"></div>
        <div class="field-group"><label>建物格局</label><input type="text" id="f_layout" placeholder="例：3房2廳2衛" oninput="renderOutput()"></div>
        <div class="field-group"><label>車位形式</label><input type="text" id="f_parking" placeholder="例：坡道平面" oninput="renderOutput()"></div>
        <div class="field-group"><label>樓層</label><input type="text" id="f_floor" placeholder="例：8樓／14樓" oninput="renderOutput()"></div>
        <div class="field-group"><label>屋齡</label><input type="text" id="f_age" placeholder="例：約 1 年" oninput="renderOutput()"></div>
        <div class="field-group field-full">
          <label>物件特色說明（每行一項，會自動補上「‧」）</label>
          <textarea class="feature-editor" id="f_features" placeholder="抓取後將自動條列於此，亦可隨時手動編輯增刪..." oninput="renderOutput()"></textarea>
        </div>
      </div>
    </div>

    <div class="card output-container">
      <div class="section-title"><span>文案預覽（標準格式）</span></div>
      <div class="preview-box" id="outputPreview">
        <div class="empty-state">
          <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <p>尚未載入資料<br><span style="font-size: 12px;">貼上永慶物件網址並點擊抓取，文案將立即在此呈現</span></p>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn btn-copy" onclick="copyResult()">📋 一鍵複製完整文案</button>
        <button class="btn btn-line" onclick="shareToLine()">傳送 LINE</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentFullText = "";

function openYungChing() {
  window.open("https://buy.yungching.com.tw/list/%E5%8F%B0%E5%8D%97%E5%B8%82-_c", "_blank");
}

document.getElementById("targetUrl").addEventListener("keypress", (e) => {
  if (e.key === "Enter") fetchAndParse();
});

function clearInput() {
  document.getElementById("targetUrl").value = "";
  document.getElementById("targetUrl").focus();
}

// 智慧清洗網址：從各種複雜長網址中精準抽出標準物件頁面網址
function cleanUrl(raw) {
  let u = raw.trim();
  const m = u.match(/house\/(\d+)/);
  if (m) {
    return `https://buy.yungching.com.tw/house/${m[1]}`;
  }
  if (/^\d+$/.test(u)) {
    return `https://buy.yungching.com.tw/house/${u}`;
  }
  return u.split("?")[0];
}

// 多通道自動穿透獲取
async function fetchCleanHtml(targetUrl) {
  // 通道 1: AllOrigins raw
  try {
    const r1 = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`);
    if (r1.ok) {
      const t1 = await r1.text();
      if (t1.includes("建物坪數") || t1.includes("特色說明") || t1.includes("主建物")) return t1;
    }
  } catch (e) {}

  // 通道 2: AllOrigins json
  try {
    const r2 = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
    if (r2.ok) {
      const d2 = await r2.json();
      if (d2.contents && (d2.contents.includes("建物坪數") || d2.contents.includes("特色說明") || d2.contents.includes("主建物"))) return d2.contents;
    }
  } catch (e) {}

  // 通道 3: CodeTabs
  try {
    const r3 = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`);
    if (r3.ok) {
      const t3 = await r3.text();
      if (t3.includes("建物坪數") || t3.includes("特色說明") || t3.includes("主建物")) return t3;
    }
  } catch (e) {}

  throw new Error("PROXIES_UNAVAILABLE");
}

async function fetchAndParse() {
  const urlInput = document.getElementById("targetUrl").value.trim();
  const status = document.getElementById("statusMessage");
  const btn = document.getElementById("fetchBtn");

  if (!urlInput) {
    showToast("⚠️ 請先貼上永慶物件網址！");
    return;
  }

  const finalUrl = cleanUrl(urlInput);

  btn.disabled = true;
  btn.style.opacity = "0.7";
  status.innerText = "連線解析物件資料中，請稍候...";
  status.style.color = "var(--primary)";

  try {
    const rawHtml = await fetchCleanHtml(finalUrl);
    const parser = new DOMParser();
    const doc = parser.parseFromString(rawHtml, "text/html");
    const fullHtml = doc.body.innerText;

    const textOf = (selector) => {
      const el = doc.querySelector(selector);
      return el ? el.innerText.trim() : "";
    };

    const findPattern = (reg, defaultVal = "--") => {
      const match = fullHtml.match(reg);
      return match ? match[1].trim() : defaultVal;
    };

    // 1. 開價
    let price = "--";
    const pEl = doc.querySelector(".price, .text-price, .house-price");
    if (pEl && /^[0-9,.]+\s*萬$/.test(pEl.innerText.trim())) {
      price = pEl.innerText.trim();
    } else {
      const m = fullHtml.match(/([0-9,.]+)\s*萬/);
      price = m ? `${m[1]}萬` : "--";
    }

    // 2. 地址與社區
    let address = textOf(".house-info-addr") || textOf("span[itemprop='address']") || textOf(".address");
    if (!address || address.includes("實價")) {
      const addrMatch = fullHtml.match(/(台南市[^\s\n\r]+(?:路|街|巷|段|區)[^\s\n\r]*)/);
      address = addrMatch ? addrMatch[1] : "台南市永康區";
    }
    const community = textOf(".community-name");
    const fullAddress = (community && !address.includes(community)) ? `${address}（${community}）` : address;

    // 3. 坪數規格
    const totalPing = findPattern(/建物坪數[\s\S]*?([\d\.]+\s*坪(\(含車位[\d\.]+坪\))?)/) || findPattern(/建物([\d\.]+坪)/);
    const mainPing = findPattern(/主建物[\s\S]*?([\d\.]+\s*坪)/) || "--";
    const subPing = findPattern(/附屬建物[\s\S]*?([\d\.]+\s*坪(\([^\)]+\))?)/) || "--";
    const sharedPing = findPattern(/共同使用[\s\S]*?([\d\.]+\s*坪)/) || "--";
    const layout = findPattern(/建物格局[\s\S]*?([0-9]+房[^\n\r]+)/) || findPattern(/([0-9]+房\(室\)[0-9]+廳[0-9]+衛)/);
    const floor = findPattern(/樓層[\s\S]*?([0-9]+[\s\/]+[0-9]+樓)/) || findPattern(/([0-9]+\/[0-9]+樓)/);
    const age = findPattern(/屋齡[\s\S]*?([\d\.]+\s*年)/) || findPattern(/屋齡\s*([\d\.]+\s*年)/);

    // 4. 車位
    let parking = "坡道平面";
    if (fullHtml.includes("平面車位") || fullHtml.includes("B1平面")) {
      const parkMatch = fullHtml.match(/([B0-9]+平面車位)/);
      parking = parkMatch ? parkMatch[1] : "坡道平面";
    } else if (fullHtml.includes("機械車位")) {
      parking = "機械車位";
    }

    // 5. 特色說明
    let featureItems = [];
    const descSection = doc.querySelector(".detail-intro, .house-intro, .text-content");
    if (descSection) {
      featureItems = descSection.innerText.split("\n").map(s => s.trim().replace(/^[‧•\-\*]\s*/, "")).filter(s => s.length > 5);
    } else {
      const featureMatch = fullHtml.match(/特色說明([\s\S]*?)基本資訊/);
      if (featureMatch) {
        featureItems = featureMatch[1].split("\n").map(s => s.trim().replace(/^[‧•\-\*]\s*/, "")).filter(s => s.length > 4);
      }
    }

    if (featureItems.length === 0) {
      featureItems = [
        "核心地段，街廓整齊、道路規劃完善，居住環境優質。",
        "近綠意公園與市圖總館，兼具文教與休閒運動氛圍。",
        "公設規劃完善，管理嚴謹，自住投資皆宜。"
      ];
    }

    // 回填至左側微調編輯表單
    document.getElementById("f_price").value = price.replace(/\s+/g, '');
    document.getElementById("f_address").value = fullAddress;
    document.getElementById("f_totalPing").value = totalPing;
    document.getElementById("f_mainPing").value = mainPing;
    document.getElementById("f_subPing").value = subPing;
    document.getElementById("f_sharedPing").value = sharedPing;
    document.getElementById("f_layout").value = layout;
    document.getElementById("f_parking").value = parking;
    document.getElementById("f_floor").value = floor;
    document.getElementById("f_age").value = age !== "--" ? `約 ${age}` : "--";
    document.getElementById("f_features").value = featureItems.join("\n");

    renderOutput();

    status.innerText = "✅ 資料擷取成功！隨時可微調或點擊複製。";
    status.style.color = "var(--accent-green)";
    showToast("⚡ 抓取成功！文案已排版完畢");

  } catch (err) {
    status.innerText = "❌ 暫時無法連線該網頁，請確認貼上的是否為物件詳細頁網址。";
    status.style.color = "#ef4444";
    showToast("⚠️ 抓取失敗，請確認網址");
  } finally {
    btn.disabled = false;
    btn.style.opacity = "1";
  }
}

function renderOutput() {
  const price = document.getElementById("f_price").value || "--";
  const address = document.getElementById("f_address").value || "--";
  const totalPing = document.getElementById("f_totalPing").value || "--";
  const mainPing = document.getElementById("f_mainPing").value || "--";
  const subPing = document.getElementById("f_subPing").value || "--";
  const sharedPing = document.getElementById("f_sharedPing").value || "--";
  const layout = document.getElementById("f_layout").value || "--";
  const parking = document.getElementById("f_parking").value || "坡道平面";
  const floor = document.getElementById("f_floor").value || "--";
  const age = document.getElementById("f_age").value || "--";

  const rawFeatures = document.getElementById("f_features").value;
  const featureList = rawFeatures.split("\n")
    .map(s => s.trim())
    .filter(s => s.length > 0)
    .map(s => s.startsWith("‧") ? s : `‧ ${s}`)
    .join("\n");

  const fullText = 
`開價｜${price}
地址｜${address}
總建｜${totalPing}
主建｜${mainPing}
附屬｜${subPing}
共有｜${sharedPing}
格局｜${layout}
車位｜${parking}
樓層｜${floor}
屋齡｜${age}
━━━━━━━━━━━━━━
${featureList}
────────────────
歡迎預約賞屋

👤 張英泓｜永慶不動產東橋銘星店
📞 0962-062-425
💬 LINE ID：0962062425

以上資料如有記載錯誤，依實際登記權狀為準
‧ 永慶不動產東橋銘星店
‧ 銘星格鼎不動產仲介經紀有限公司
‧ 經紀人陳建民(106南市字第00449號)`;

  currentFullText = fullText;
  document.getElementById("outputPreview").innerText = fullText;
}

function copyResult() {
  if (!currentFullText || currentFullText.includes("開價｜--")) {
    showToast("⚠️ 目前尚無文案可供複製");
    return;
  }
  navigator.clipboard.writeText(currentFullText).then(() => {
    showToast("📋 已複製到剪貼簿！可直接貼至 LINE / FB");
  });
}

function shareToLine() {
  if (!currentFullText) {
    showToast("⚠️ 請先抓取物件後再分享");
    return;
  }
  const lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(currentFullText)}`;
  window.open(lineUrl, '_blank');
}

function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.innerText = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2500);
}
</script>

</body>

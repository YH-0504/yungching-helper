<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>永慶物件文案速成小工具</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif; }
    body { background-color: #f3f4f6; margin: 0; padding: 20px; color: #1f2937; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 24px; }
    h1 { margin-top: 0; font-size: 22px; color: #111827; border-left: 5px solid #f59e0b; padding-left: 10px; }
    .input-box { display: flex; gap: 10px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; padding: 12px 14px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s; }
    input[type="text"]:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.2); }
    button { background: #f59e0b; color: #fff; font-weight: bold; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 15px; transition: 0.2s; white-space: nowrap; }
    button:hover { background: #d97706; }
    button.copy-btn { background: #10b981; font-size: 16px; width: 100%; margin-top: 15px; padding: 14px; }
    button.copy-btn:hover { background: #059669; }
    .status { font-size: 13px; color: #6b7280; margin-bottom: 16px; min-height: 18px; }
    .status.loading { color: #f59e0b; font-weight: bold; }
    .status.error { color: #ef4444; }
    .status.success { color: #10b981; font-weight: bold; }
    .preview-area { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; min-height: 380px; }
    .helper-text { font-size: 12px; color: #9ca3af; margin-top: -6px; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h1>永慶房仲文案自動擷取器（極速版）</h1>

  <div class="input-box">
    <input type="text" id="houseId" placeholder="請輸入物件編號（如：7306855 或 YC1035472）或直接貼網址" value="7306855">
    <button id="fetchBtn" onclick="fetchAndParse()">快速抓取整理</button>
  </div>
  <div class="helper-text">支援純數字 ID

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英泓廣告小幫手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --primary-glow: rgba(245, 158, 11, 0.25);
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(15, 23, 42, 0.6);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --line-color: #06c755;
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1080px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      color: #fff;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-text p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .badge-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
    }

    .badge-status::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .search-box {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      min-width: 260px;
    }

    .input-wrapper svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    input[type="text"], textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 15px;
      padding: 14px 16px 14px 46px;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: rgba(15, 23, 42, 0.85);
    }

    input::placeholder, textarea::placeholder {
      color: rgba(148, 163, 184, 0.6);
      font-weight: 300;
    }

    .clear-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #0f172a;
      font-weight: 700;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .btn-primary:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .search-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-chips {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      transition: 0.15s;
    }

    .chip:hover {
      background: var(--primary-glow);
      border-color: var(--primary);
      color: #fff;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field-full {
      grid-column: span 2;
    }

    .field-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .field-group input {
      padding: 10px 14px;
      font-size: 14px;
    }

    textarea.feature-editor {
      min-height: 180px;
      line-height: 1.6;
      resize: vertical;
      padding: 12px 14px;
      font-size: 13px;
    }

    .output-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .preview-box {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 20px;
      font-size: 14.5px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-all;
      flex: 1;
      min-height: 480px;
      font-family: 'Noto Sans TC', sans-serif;
      position: relative;
    }

    .empty-state {
      height: 100%;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-align: center;
      gap: 12px;
    }

    .empty-state svg {
      opacity: 0.3;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }

    .btn-copy {
      background: var(--accent-green);
      color: #fff;
    }

    .btn-copy:hover {
      background: var(--accent-green-hover);
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .btn-line {
      background: var(--line-color);
      color: #fff;
    }

    .btn-line:hover {
      filter: brightness(1.1);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      border-left: 4px solid var(--accent-green);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="brand">
      <div class="brand-icon">英</div>
      <div class="brand-text">
        <h1>英泓廣告小幫手</h1>
        <p>一鍵抓取永慶物件 ‧ 格式精準成型</p>
      </div>
    </div>
    <div class="badge-status">多線路自動備援已就緒</div>
  </header>

  <section class="card">
    <div class="search-box">
      <div class="input-wrapper">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input type="text" id="houseId" placeholder="請輸入物件編號（如：7306855 或 YC1035472）或直接貼上網址..." autocomplete="off">
        <button class="clear-btn" id="clearInput" onclick="clearSearch()">✕</button>
      </div>
      <button class="btn btn-primary" id="fetchBtn" onclick="fetchAndParse()">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        極速抓取整理
      </button>
    </div>

    <div class="search-meta">
      <div class="history-chips" id="historyChips">
        <span style="font-size: 12px; opacity: 0.6;">歷史紀錄：</span>
      </div>
      <div id="statusMessage">輸入物件編號後點擊「極速抓取整理」</div>
    </div>
  </section>

  <div class="main-grid">
    <div class="card">
      <div class="section-title">
        <span>規格細項微調</span>
        <span style="font-size: 11px; color: var(--text-muted); font-weight: normal;">修改後預覽同步更新</span>
      </div>

      <div class="field-grid">
        <div class="field-group">
          <label>開價</label>
          <input type="text" id="f_price" placeholder="例：1,536萬" oninput="renderOutput()">
        </div>
        <div class="field-group">
          <label>地址 / 社區</label>
          <input type="text" id="f_address" placeholder="例：台南市永康區永勝街" oninput="renderOutput()">
        </div>
        <div class="field-group">
          <label>總建坪數</label>
          <input type="text" id="f_totalPing" placeholder="例：48.98坪" oninput="renderOutput()">
        </div>
        <div class="field-group">
          <label>主建物</label>
          <input type="text" id="f_mainPing" placeholder="例：22.71坪" oninput="renderOutput()">
        </div>
        <div class="field-group">
          <label>附屬建物</label>
          <input type="text" id="f_subPing" placeholder="例：2.98坪" oninput="renderOutput()">
        </div>
        <div class="field-group">
          <label>共同使用</label>
          <input type="text" id="f_sharedPing" placeholder="例：23.29坪" oninput="renderOutput()">
        </div>
        <div class="field-group">
          <label>建物格局</label>
          <input type="text" id="f_layout" placeholder="例：3房2廳2衛" oninput="renderOutput()">
        </div>
        <div class="field-group">
          <label>車位形式</label>
          <input type="text" id="f_parking" placeholder="例：坡道平面" oninput="renderOutput()">
        </div>
        <div class="field-group">
          <label>樓層</label>
          <input type="text" id="f_floor" placeholder="例：8樓／14樓" oninput="renderOutput()">
        </div>
        <div class="field-group">
          <label>屋齡</label>
          <input type="text" id="f_age" placeholder="例：約 1 年" oninput="renderOutput()">
        </div>
        <div class="field-group field-full">
          <label>物件特色說明（每行一項，會自動補上「‧」）</label>
          <textarea class="feature-editor" id="f_features" placeholder="抓取後將自動條列於此，亦可手動增刪..." oninput="renderOutput()"></textarea>
        </div>
      </div>
    </div>

    <div class="card output-container">
      <div class="section-title">
        <span>文案預覽（標準格式）</span>
      </div>

      <div class="preview-box" id="outputPreview">
        <div class="empty-state">
          <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <p>尚未載入資料<br><span style="font-size:
